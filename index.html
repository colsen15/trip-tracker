html, body { margin: 0; background: #08090C; }
@keyframes cpRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes cpGlow { 0%,100% { opacity: .35; } 50% { opacity: .75; } }
.cp-rise { animation: cpRise .55s cubic-bezier(.22,.9,.28,1) both; }
body { -webkit-font-smoothing: antialiased; }
.cp-card { transition: border-color .35s ease, background .35s ease, transform .2s cubic-bezier(.16,.84,.34,1); }
.cp-card:active { transform: scale(.994); }
.cp-tap { transition: background .25s ease, color .25s ease, border-color .25s ease, opacity .2s ease; }
.cp-tap:active { opacity: .7; }
.cp-open { overflow: hidden; transition: max-height .45s cubic-bezier(.16,.84,.34,1), opacity .3s ease; }
.cp-chev { transition: transform .3s cubic-bezier(.16,.84,.34,1); }
.cp-chev-on { transform: rotate(90deg); }
.cp-glow { animation: cpGlow 4s ease-in-out infinite; }
.cp-sheen { position: relative; }
* { -webkit-tap-highlight-color: transparent; }
input, textarea, select { transition: border-color .25s ease; }
input:focus, textarea:focus, select:focus { border-color: #6F9FE0 !important; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #1D242F; border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }
